plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/**
 * CurseForge API key 注入策略（与参考实现一致，绝不硬编码 / 提交）：
 *   环境变量 CURSEFORGE_API_KEY  →  仓库根 .curseforge_api.txt（已 gitignore）  →  Gradle 属性 curseforge_api_key
 * 全部缺失时为空字符串，CurseForgeRepo 会自动回落到免 key 的 MCIM 镜像。
 */
def curseForgeApi = System.getenv("CURSEFORGE_API_KEY")
if (!curseForgeApi) {
    def keyFile = rootProject.file(".curseforge_api.txt")
    if (keyFile.exists()) curseForgeApi = keyFile.text.trim()
}
if (!curseForgeApi) {
    curseForgeApi = (project.findProperty("curseforge_api_key") ?: "")
}

android {
    namespace 'com.tubo.mcserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.tubo.mcserver"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"

        buildConfigField "String", "CURSEFORGE_API", "\"${curseForgeApi}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        // 与 Kotlin 1.9.24 配套的 Compose 编译器版本
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.tukaani:xz:1.9'

    // ---- Compose / Material3（UI 统一走 ZL2 的 Compose 方案） ----
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
